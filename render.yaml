# TRIO AI Discovery Platform — Render Deployment Configuration

services:
  # ─── Backend (FastAPI) ────────────────────────────────────────────
  - type: web
    name: trio-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trio-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://trio-ai.vercel.app
      - key: EMAIL_FROM
        value: "TRIO <noreply@trio-ai.dev>"
      - key: RESEND_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGINS
        value: "https://trio-ai.vercel.app"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,trio-backend.onrender.com,*.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.10"

  # ─── Redis (Rate Limiting) ───────────────────────────────────────
  - type: redis
    name: trio-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Allow all internal

# ─── PostgreSQL Database ─────────────────────────────────────────────
databases:
  - name: trio-db
    plan: free
    region: oregon
    databaseName: trio_db
    user: trio_user
    ipAllowList: []  # Allow all internal

