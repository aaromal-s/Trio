services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops_secure_password_2026
      POSTGRES_DB: aegisops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisops_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aegisops:aegisops_secure_password_2026@postgres:5432/aegisops_db
      SECRET_KEY: aegisops_enterprise_production_secret_key_change_in_prod_9876543210
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisops_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
