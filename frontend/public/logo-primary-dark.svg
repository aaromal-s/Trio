<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="logoDarkGrad" x1="16" y1="8" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGradDark" x1="90" y1="20" x2="280" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield -->
    <path d="M32 4L54 14V34C54 48 44 59 32 63C20 59 10 48 10 34V14L32 4Z" 
          fill="#0a1024" 
          stroke="url(#logoDarkGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Geometric 'A' Apex -->
    <path d="M32 12L19 44H28L32 32L36 44H45L32 12Z" 
          fill="url(#logoDarkGrad)" 
          filter="url(#logoGlow)"/>

    <!-- Intelligence Node -->
    <circle cx="32" cy="30" r="3.5" fill="#ffffff"/>
    <circle cx="32" cy="30" r="1.5" fill="#060913"/>

    <!-- Crossbar -->
    <line x1="24" y1="40" x2="40" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="53" r="2" fill="#00f0ff"/>
  </g>

  <!-- Wordmark: AEGISOPS -->
  <text x="86" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2.5" fill="url(#textGradDark)">
    AEGISOPS
  </text>

  <!-- AI Pill Badge -->
  <rect x="256" y="27" width="34" height="22" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="264" y="43" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00f0ff" letter-spacing="1">
    AI
  </text>

  <!-- Tagline -->
  <text x="88" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#94a3b8" text-transform="uppercase">
    ENTERPRISE AIOPS INTELLIGENCE
  </text>
</svg>
