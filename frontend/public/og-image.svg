<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="ogBgGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0b112c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04060d" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanOrb" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb" cx="20%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="ogShieldGrad" x1="0" y1="0" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="ogTextGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="ogGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="#04060d"/>
  <rect width="1200" height="630" fill="url(#ogBgGlow)"/>
  <circle cx="960" cy="250" r="450" fill="url(#cyanOrb)"/>
  <circle cx="240" cy="440" r="400" fill="url(#violetOrb)"/>

  <!-- Telemetry Grid Matrix -->
  <g opacity="0.12" stroke="#3b82f6" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>

    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(80, 70)">
    <rect width="270" height="36" rx="18" fill="#0c142e" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="4" fill="#00f0ff" filter="url(#ogGlow)"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#22d3ee" letter-spacing="1.5">
      AEGISOPS AI ENTERPRISE
    </text>
  </g>

  <!-- Hero Headline -->
  <text x="80" y="180" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Detect. Predict. Resolve.
  </text>
  <text x="80" y="245" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#ogTextGrad)" letter-spacing="-1">
    Before Incidents Happen.
  </text>

  <!-- Subheadline -->
  <text x="80" y="315" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Autonomous operations intelligence with anomaly detection,
  </text>
  <text x="80" y="345" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    +30min incident risk estimation, and evidence-based investigation.
  </text>

  <!-- Key Metrics Strip -->
  <g transform="translate(80, 420)">
    <!-- Metric 1 -->
    <rect width="210" height="110" rx="16" fill="#0d1633" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="24" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-transform="uppercase">TEST ACCURACY</text>
    <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800" fill="#10b981">99.89%</text>
    <text x="24" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#475569">900 held-out samples</text>

    <!-- Metric 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="110" rx="16" fill="#0d1633" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <text x="24" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-transform="uppercase">PREDICTION HORIZON</text>
      <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800" fill="#00f0ff">+30 Min</text>
      <text x="24" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#475569">Early incident warning</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="110" rx="16" fill="#0d1633" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <text x="24" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-transform="uppercase">TELEMETRY STREAM</text>
      <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="800" fill="#a855f7">5-Second</text>
      <text x="24" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#475569">Real-time sync rate</text>
    </g>
  </g>

  <!-- Big Right Side Geometric Aegis 'A' Shield Emblem -->
  <g transform="translate(860, 160)">
    <!-- Outer Shield Frame -->
    <path d="M120 20L200 60V150C200 210 160 260 120 280C80 260 40 210 40 150V60L120 20Z" 
          fill="#091029" 
          stroke="url(#ogShieldGrad)" 
          stroke-width="5" 
          filter="url(#ogGlow)"/>

    <!-- Geometric 'A' Beams -->
    <path d="M120 50L70 190H105L120 145L135 190H170L120 50Z" 
          fill="url(#ogShieldGrad)"/>

    <!-- Central Node -->
    <circle cx="120" cy="135" r="14" fill="#ffffff" filter="url(#ogGlow)"/>
    <circle cx="120" cy="135" r="6" fill="#060913"/>

    <!-- Crossbar -->
    <line x1="88" y1="172" x2="152" y2="172" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="88" cy="172" r="5" fill="#00f0ff"/>
    <circle cx="152" cy="172" r="5" fill="#a855f7"/>

    <!-- Sentinel Pulse Beam -->
    <circle cx="120" cy="235" r="7" fill="#00f0ff" filter="url(#ogGlow)"/>
    <line x1="120" y1="190" x2="120" y2="225" stroke="#00f0ff" stroke-width="4" stroke-dasharray="5 5"/>
  </g>
</svg>
