<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="aegisGrad" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="28" y1="28" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="100" y1="28" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="128" height="128" rx="32" fill="#060913"/>
  <rect width="126" height="126" x="1" y="1" rx="31" stroke="url(#aegisGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Outer Protective Shield -->
  <path d="M64 16L100 32V66C100 89 85 107 64 114C43 107 28 89 28 66V32L64 16Z" 
        fill="#0a1024" 
        stroke="url(#aegisGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Geometric 'A' Apex and Legs -->
  <path d="M64 28L42 78H56L64 56L72 78H86L64 28Z" 
        fill="url(#aegisGrad)" 
        filter="url(#iconGlow)"/>

  <!-- Intersecting Facet Shading -->
  <path d="M64 28L42 78H56L64 56V28Z" fill="url(#facetLeft)"/>
  <path d="M64 28L86 78H72L64 56V28Z" fill="url(#facetRight)"/>

  <!-- Central Intelligence Node -->
  <circle cx="64" cy="54" r="6" fill="#ffffff" filter="url(#iconGlow)"/>
  <circle cx="64" cy="54" r="2.5" fill="#060913"/>

  <!-- Telemetry Bridge Crossbar -->
  <line x1="50" y1="72" x2="78" y2="72" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="72" r="2.5" fill="#00f0ff"/>
  <circle cx="78" cy="72" r="2.5" fill="#a855f7"/>

  <!-- Sentinel Base Pulse -->
  <circle cx="64" cy="96" r="3.5" fill="#00f0ff" filter="url(#iconGlow)"/>
  <line x1="64" y1="78" x2="64" y2="92" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="3 3"/>
</svg>
