<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="24" y1="20" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded shield canvas -->
  <rect width="64" height="64" rx="16" fill="#060913"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Geometric Aegis "A" Shield Motif -->
  <!-- Outer Shield Shell -->
  <path d="M32 8L50 16V33C50 44.5 42.5 53.5 32 57C21.5 53.5 14 44.5 14 33V16L32 8Z" 
        fill="#0a1024" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Left Facet of 'A' -->
  <path d="M32 14L21 39H28L32 28L36 39H43L32 14Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Central Intelligence Node & Crossbar -->
  <circle cx="32" cy="27" r="3.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="27" r="1.5" fill="#060913"/>

  <!-- Horizontal Stabilizer Beam / Telemetry Node Link -->
  <line x1="25" y1="36" x2="39" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Lower Anchor Telemetry Pulse -->
  <circle cx="32" cy="48" r="2" fill="#00f0ff"/>
  <line x1="32" y1="39" x2="32" y2="46" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>