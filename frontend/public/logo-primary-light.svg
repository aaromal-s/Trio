<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="logoLightGrad" x1="16" y1="8" x2="68" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield -->
    <path d="M32 4L54 14V34C54 48 44 59 32 63C20 59 10 48 10 34V14L32 4Z" 
          fill="#f8fafc" 
          stroke="url(#logoLightGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Geometric 'A' Apex -->
    <path d="M32 12L19 44H28L32 32L36 44H45L32 12Z" 
          fill="url(#logoLightGrad)"/>

    <!-- Intelligence Node -->
    <circle cx="32" cy="30" r="3.5" fill="#ffffff"/>
    <circle cx="32" cy="30" r="1.5" fill="#0f172a"/>

    <!-- Crossbar -->
    <line x1="24" y1="40" x2="40" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="53" r="2" fill="#0284c7"/>
  </g>

  <!-- Wordmark: AEGISOPS -->
  <text x="86" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2.5" fill="#0f172a">
    AEGISOPS
  </text>

  <!-- AI Pill Badge -->
  <rect x="256" y="27" width="34" height="22" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.2"/>
  <text x="264" y="43" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#2563eb" letter-spacing="1">
    AI
  </text>

  <!-- Tagline -->
  <text x="88" y="63" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#475569" text-transform="uppercase">
    ENTERPRISE AIOPS INTELLIGENCE
  </text>
</svg>
